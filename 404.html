<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Yanyan Wang</title>
<meta name="description" content="That page does not exist on yanyanvv.github.io.">
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;700&amp;family=Source+Serif+4:opsz,wght@8..60,400&amp;display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #232A3D;
    --muted: #6E7690;
    --label: #98A0B8;
    --accent: #E76A8B;
    --sans: 'Helvetica Neue', 'Instrument Sans', Helvetica, Arial, sans-serif;
    --serif: 'Source Serif 4', Georgia, serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #FFFFFF;
    color: var(--ink);
    font-family: var(--serif);
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 1000px;
    margin: 0 auto;
    padding: clamp(64px, 14vh, 140px) clamp(20px, 5vw, 56px) 80px;
  }
  .label {
    font-family: var(--sans);
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--label);
    margin: 0;
  }
  h1 {
    font-family: var(--sans);
    font-weight: 700;
    font-size: 28px;
    line-height: 33px;
    letter-spacing: -0.015em;
    margin: 16px 0 0;
  }
  p.lede { font-size: 17px; line-height: 29px; max-width: 52ch; margin: 12px 0 0; color: var(--muted); }
  .home {
    display: inline-block;
    margin-top: 28px;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    color: var(--ink);
    padding: 7px 14px;
    border: 1px solid #D5DAE6;
    border-radius: 999px;
    transition: border-color 0.15s ease, color 0.15s ease, background-color 0.15s ease;
  }
  .home:hover { border-color: var(--accent); color: var(--accent); background: #FDF3F6; }
  .home:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<div class="wrap">
  <p class="label">404</p>
  <h1>Page not found</h1>
  <p class="lede">That page does not exist. The home page has everything: about, writing, and skills.</p>
  <a class="home" href="/">Go to the home page</a>
</div>
</body>
</html>
